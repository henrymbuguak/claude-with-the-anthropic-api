site_name: Claude Chat CLI with Hybrid RAG Retrieval
site_description: Build a Claude-powered CLI with streaming, hybrid retrieval, citations, and evaluation.
site_url: https://henrymbuguak.github.io/claude-with-the-anthropic-api/
repo_url: https://github.com/henrymbuguak/claude-with-the-anthropic-api
repo_name: henrymbuguak/claude-with-the-anthropic-api
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Architecture: architecture.md
