name: Guide checks

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/write-guide/**"
      - ".github/workflows/generate-guide.yml"
      - ".github/workflows/guides.yml"
      - "app/rag/ingest.py"
      - "docs/contributing/**"
      - "docs/facts.json"
      - "docs/guides/**"
      - "eval/**"
      - "guides/**"
      - "harness/**"
      - "mkdocs.yml"
      - "tests/test_rag_ingest.py"
      - "tests/test_measure_facts.py"
      - "tests/test_prepare_generation.py"
      - "tests/test_validate_generation.py"
      - "tests/test_verify_facts.py"
      - "tests/test_verify_guides.py"
  pull_request:
    branches: [main]
    paths:
      - ".claude/skills/write-guide/**"
      - ".github/workflows/generate-guide.yml"
      - ".github/workflows/guides.yml"
      - "app/rag/ingest.py"
      - "docs/contributing/**"
      - "docs/facts.json"
      - "docs/guides/**"
      - "eval/**"
      - "guides/**"
      - "harness/**"
      - "mkdocs.yml"
      - "tests/test_rag_ingest.py"
      - "tests/test_measure_facts.py"
      - "tests/test_prepare_generation.py"
      - "tests/test_validate_generation.py"
      - "tests/test_verify_facts.py"
      - "tests/test_verify_guides.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test documentation tooling
        run: |
          uv run pytest \
            tests/test_rag_ingest.py \
            tests/test_measure_facts.py \
            tests/test_prepare_generation.py \
            tests/test_validate_generation.py \
            tests/test_verify_facts.py \
            tests/test_verify_guides.py \
            -q

      - name: Lint documentation tooling
        run: |
          uv run ruff check \
            app/rag/ingest.py \
            harness \
            tests/test_rag_ingest.py \
            tests/test_measure_facts.py \
            tests/test_prepare_generation.py \
            tests/test_validate_generation.py \
            tests/test_verify_facts.py \
            tests/test_verify_guides.py

      - name: Verify measured facts and curriculum
        run: uv run python -m harness.verify_facts --root .

      - name: Verify approved offline guide commands
        run: uv run python -m harness.verify_guides "docs/guides/*.md" --execute --root .

      - name: Build documentation strictly
        run: uvx --from mkdocs-material==9.6.20 mkdocs build --strict --site-dir site
